<header
    class="h-20 bg-primary/50 backdrop-blur-md border-b border-white/5 sticky top-0 z-40 px-8 flex items-center justify-between">
    <div class="flex items-center gap-4">
        <!-- Mobile Menu Toggle -->
        <button class="lg:hidden text-white p-2">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <h2 class="text-xl font-bold text-white hidden md:block">{% block page_title %}Dashboard Overview{% endblock %}
        </h2>
    </div>

    <div class="flex items-center gap-6">
        <!-- Search -->
        <div class="relative hidden sm:block">
            <input type="text" placeholder="Search..."
                class="bg-white/5 border border-white/10 rounded-full px-10 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/50 w-64 transition-all">
            <svg class="h-4 w-4 text-slate-500 absolute left-4 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        </div>

        <!-- Notifications -->
        <div class="relative group cursor-pointer">
            <div
                class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center hover:bg-white/10 transition-all">
                <svg class="h-5 w-5 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg>
                <span class="absolute top-2 right-2 w-2 h-2 bg-accent rounded-full border-2 border-primary"></span>
            </div>

            <!-- Quick Notifications Dropdown -->
            <div
                class="absolute right-0 mt-4 w-80 glass-card p-4 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50">
                <h4 class="font-bold mb-4">Recent Notifications</h4>
                <div class="space-y-3">
                    {% for note in notifications %}
                    <div
                        class="text-xs p-3 bg-white/5 rounded-xl border border-white/5 hover:bg-white/10 cursor-default">
                        <p class="text-white">{{ note.message }}</p>
                        <p class="text-slate-500 mt-1">{{ note.created_at|timesince }} ago</p>
                    </div>
                    {% empty %}
                    <p class="text-xs text-slate-500 text-center py-4">No new notifications</p>
                    {% endfor %}
                </div>
            </div>
        </div>

        <!-- Profile -->
        <div class="relative group">
            <div class="flex items-center gap-3 cursor-pointer pl-4 border-l border-white/10">
                <div class="text-right hidden sm:block">
                    <p class="text-sm font-bold text-white">{{ user.username }}</p>
                    <p class="text-[10px] text-accent font-black uppercase">{{ user.role }}</p>
                </div>
                <div
                    class="w-10 h-10 rounded-xl bg-gradient-to-br from-accent to-emerald-700 flex items-center justify-center text-white font-bold shadow-lg shadow-accent/20">
                    {{ user.username|first|upper }}
                </div>
            </div>
        </div>
    </div>
</header>
