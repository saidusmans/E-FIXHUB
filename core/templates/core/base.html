<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-Fix Hub | Premium Restoration{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0F172A',
                        secondary: '#1E293B',
                        accent: '#10B981',
                        danger: '#EF4444',
                        warning: '#F59E0B',
                        info: '#3B82F6',
                    },
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                    },
                    backgroundImage: {
                        'premium-gradient': 'linear-gradient(135deg, #0F172A, #1E293B)',
                    },
                    boxShadow: {
                        'glass': '0 8px 32px rgba(0,0,0,0.35)',
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-primary text-slate-200 font-outfit antialiased selection:bg-accent/30;
                background: linear-gradient(135deg, #0F172A, #1E293B);
                min-height: 100vh;
            }
        }
        @layer components {
            .glass-card {
                @apply bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 transition-all duration-300 shadow-glass hover:bg-white/10 hover:translate-y-[-4px];
            }
            .sidebar-link {
                @apply flex items-center gap-4 px-6 py-4 text-slate-400 hover:text-white hover:bg-white/5 transition-all border-l-4 border-transparent hover:border-accent;
            }
            .sidebar-link.active {
                @apply text-white bg-white/10 border-accent;
            }
            .btn-accent {
                @apply bg-accent hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-lg shadow-accent/20 active:scale-95;
            }
            .btn-primary {
                @apply bg-accent/10 hover:bg-accent text-accent hover:text-white font-bold py-2 px-6 rounded-xl border border-accent/30 hover:border-accent transition-all active:scale-95;
            }
            .btn-secondary {
                @apply bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white font-bold py-2 px-6 rounded-xl border border-white/10 hover:border-white/20 transition-all active:scale-95;
            }
            .input-premium {
                @apply w-full bg-white/5 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-accent/50 focus:border-accent transition-all;
            }
            .status-badge {
                @apply px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider;
            }
        }
        
        .page-fade {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body class="flex overflow-x-hidden">

    {% block sidebar %}
    {% include 'core/includes/sidebar.html' %}
    {% endblock %}

    <div class="flex-1 flex flex-col min-h-screen">
        {% include 'core/includes/navbar.html' %}

        <main class="flex-1 p-6 md:p-8 page-fade">
            {% block content %}{% endblock %}
        </main>

        {% include 'core/includes/footer.html' %}
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed bottom-8 right-8 z-50"></div>

    <script>
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const colors = {
                'info': 'border-info',
                'success': 'border-accent',
                'warning': 'border-warning',
                'error': 'border-danger'
            };
            toast.className = `glass-card mb-4 flex items-center gap-3 animate-slide-up border-l-4 ${colors[type] || 'border-info'}`;
            toast.innerHTML = `<span class="text-sm font-bold italic tracking-tight uppercase">${message}</span>`;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 500);
            }, 5000);
        }

        // Initialize Django messages as toasts
        {% if messages %}
        {% for message in messages %}
        showToast("{{ message|escapejs }}", "{{ message.tags }}");
        {% endfor %}
        {% endif %}
    </script>

    {% block extra_js %}{% endblock %}
</body>

</html>
